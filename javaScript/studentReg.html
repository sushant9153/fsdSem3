<!DOCTYPE html>
<html>
<head>
    <title>Student Information Management System</title>


</head>

<body>

<h2>Student Information Management System</h2>

<input type="text" id="name" placeholder="Student Name">
<input type="text" id="roll" placeholder="Roll Number">

<input type="number" id="m1" placeholder="Subject 1 Marks">
<input type="number" id="m2" placeholder="Subject 2 Marks">
<input type="number" id="m3" placeholder="Subject 3 Marks">
<input type="number" id="m4" placeholder="Subject 4 Marks">
<input type="number" id="m5" placeholder="Subject 5 Marks">

<button onclick="calculate()">Calculate Result</button>

<div id="result"></div>

<script>

function grade(per){
    if(per>=90)
        return "A+";
    else if(per>=80)
        return "A";
    else if(per>=70)
        return "B";
    else if(per>=60)
        return "C";
    else if(per>=50)
        return "D";
    else
        return "F";
}

function calculate(){

    let name=document.getElementById("name").value;
    let roll=document.getElementById("roll").value;

    let s1=Number(document.getElementById("m1").value);
    let s2=Number(document.getElementById("m2").value);
    let s3=Number(document.getElementById("m3").value);
    let s4=Number(document.getElementById("m4").value);
    let s5=Number(document.getElementById("m5").value);

    let total=s1+s2+s3+s4+s5;
    let percentage=(total/500)*100;
    let g=grade(percentage);

    let result="Pass";
    if(percentage<40)
        result="Fail";

    document.getElementById("result").innerHTML=
    "<b>Name:</b> "+name+"<br>"+
    "<b>Roll No:</b> "+roll+"<br>"+
    "<b>Total:</b> "+total+"/500<br>"+
    "<b>Percentage:</b> "+percentage.toFixed(2)+"%<br>"+
    "<b>Grade:</b> "+g+"<br>"+
    "<b>Result:</b> "+result;
}

</script>

</body>
</html>
